[package]
# The binary is named after this package: blobtunes.exe. The app IDENTIFIER
# (com.hoss.wavesurf) is intentionally left alone in tauri.conf.json so the
# saved API key and the WebView2 profile survive the rename.
name = "blobtunes"
version = "0.1.0"
description = "Blobtunes — compact YouTube player"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blobtunes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
wait-timeout = "0.2"
libmpv2 = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tauri-plugin-single-instance = "2"

# Windows media session (SMTC): what Windows' media flyout, the hardware media
# keys and Venu read for now-playing state. Target-gated on purpose — no other
# platform grows a dependency it cannot use. Bridge: src/smtc.rs.
[target.'cfg(windows)'.dependencies]
playwire = "1.0"
# Below-normal priority for background prefetch yt-dlp children (ytdlp.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
